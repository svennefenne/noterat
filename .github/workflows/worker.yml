name: Worker

# The worker (apps/worker: speech to text, reading scans and recipes): only when it (or this file) changes, and
# for every v* tag (GitHub doesn't apply path filters to tags).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["apps/worker/**", ".github/workflows/worker.yml"]
  pull_request:
    paths: ["apps/worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # the tests use a fake model and a fake scanner, so they don't need faster-whisper (or its 1.5 GB
      # of CUDA) or Tesseract; OpenCV and Pillow (small) let the real page finder's tests run too, and
      # the ones that read with Tesseract skip themselves; recipe-scrapers (pure Python, small) lets
      # the recipe tests read real pages
      - run: pip install pytest opencv-python-headless==5.0.0.93 pillow==13.0.0 recipe-scrapers==15.13.0
      - run: python -m pytest -q -rs

  # the image on ghcr.io: latest from main, a version from a v* tag (pull requests only build it)
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: apps/worker
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NOTERAT_VERSION=${{ github.ref_name }}-${{ github.sha }}
          # a scope of its own, so this image's cache and Noterat's (ci.yml) don't push each other out
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

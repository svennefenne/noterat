name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # the apps built with this server, which go into its image and are offered to phones and computers as
  # updates (decision 16). (A pull request builds them in their own workflows, when they change.)
  android:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/android.yml
    secrets: inherit
  desktop:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/desktop.yml

  # the image on ghcr.io: latest from main, a version from a v* tag (pull requests only build it)
  image:
    needs: [check, android, desktop]
    if: ${{ !cancelled() && needs.check.result == 'success' && (github.event_name == 'pull_request' || (needs.android.result == 'success' && needs.desktop.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the build number counts the commits
      - id: build
        run: |
          echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/bundled"
      - name: The apps, into the image
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v8
        with:
          pattern: noterat-*
          path: ${{ runner.temp }}/bundled
          merge-multiple: true
      - run: ls -la "$RUNNER_TEMP/bundled"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: bundled=${{ runner.temp }}/bundled
          build-args: |
            NOTERAT_VERSION=${{ github.ref_name }}-${{ github.sha }}
            NOTERAT_BUILD=${{ steps.build.outputs.number }}
            NOTERAT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Desktop app

# The Linux desktop app (apps/desktop): Electron with the app's web build inside, as an AppImage.
# On main it runs from ci.yml, whose image takes the AppImage (decision 16); a pull request runs it here.
on:
  workflow_call:
  pull_request:
    paths: ["apps/desktop/**", "apps/app/**", "packages/**", "package-lock.json", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the build number counts the commits
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: The build number (the commits, as the server's and the Android app's)
        run: |
          echo "NOTERAT_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "NOTERAT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Build the app's web build
        run: npm run build -w @noterat/app

      # (apps/desktop isn't one of the root's workspaces: Electron stays out of the server's image and CI)
      - name: Build the AppImage
        id: appimage
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run dist
          version="$(node -p "require('./package.json').version")"
          mv dist/noterat-desktop-*.AppImage "$GITHUB_WORKSPACE/noterat-desktop-$version-$NOTERAT_BUILD.AppImage"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: noterat-desktop-${{ steps.appimage.outputs.version }}-${{ env.NOTERAT_BUILD }}
          path: noterat-desktop-*.AppImage
          if-no-files-found: error

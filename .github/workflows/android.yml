name: Android app

# On main it runs from ci.yml, whose image takes the APK (decision 16); a pull request runs it here.
on:
  workflow_call:
  pull_request:
    paths: ["apps/app/**", "packages/core/**", "package-lock.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the version code counts the commits
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci --no-audit --no-fund
      - name: The build number (the commits, as the server's and the desktop app's)
        run: |
          echo "NOTERAT_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "NOTERAT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Put the app's web build into the Android project
        run: npm run android -w @noterat/app

      # Signed with the app's own key when the repository has it (Settings → Secrets → Actions:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS); else with a debug key,
      # new on every run, which is fine for trying it out but can't update anything (decision 16).
      - name: Build the APK
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NOTERAT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOTERAT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export NOTERAT_VERSION_NAME="$(node -p "require('./package.json').version")"
          export NOTERAT_VERSION_CODE="$NOTERAT_BUILD"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/noterat-release.jks"
            export NOTERAT_KEYSTORE="$RUNNER_TEMP/noterat-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$NOTERAT_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$NOTERAT_VERSION_CODE" >> "$GITHUB_OUTPUT"
          cd apps/app/android && ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/noterat-android-$NOTERAT_VERSION_NAME-$NOTERAT_VERSION_CODE.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: noterat-android-${{ steps.apk.outputs.name }}-${{ steps.apk.outputs.code }}
          path: noterat-android-*.apk
          if-no-files-found: error

[project]
name = "noterat-worker"
version = "0.1.0"
description = "Noterat's worker: speech to text (KB-Whisper through faster-whisper), reading scans (OpenCV, Tesseract through OCRmyPDF) and reading recipes out of web pages (recipe-scrapers), asking a Noterat server for work."
requires-python = ">=3.12"
dependencies = [
  "faster-whisper==1.2.1",
  # faster-whisper 1.2.1 opens files with av.open(metadata_errors=...), which PyAV 19 no longer takes
  "av==18.1.0",
  # 4.9 runs Whisper's convolutions with cuBLAS, so the GPU needs cuBLAS 12 and not cuDNN
  "ctranslate2==4.9.0",
]

[project.optional-dependencies]
# CUDA 12's cuBLAS from pip, for a GPU on a machine (or in an image) without the CUDA toolkit;
# LD_LIBRARY_PATH has to point at nvidia/cublas/lib (see Dockerfile).
cuda = ["nvidia-cublas-cu12==12.9.*"]
# Reading scans: finding the page in a photo (OpenCV), and OCRmyPDF, which runs Tesseract (installed
# apart: tesseract-ocr with its swe and eng languages) and makes the searchable PDF.
ocr = [
  "ocrmypdf==17.14.1",
  "opencv-python-headless==5.0.0.93",
  "img2pdf==0.6.3",
  "pillow==13.0.0",
]
# Reading a recipe out of a web page the server fetched: recipe-scrapers (pure Python, with
# BeautifulSoup and extruct), its own scraper for a site it knows, else the page's schema.org data.
recipe = ["recipe-scrapers==15.13.0"]
test = ["pytest>=8"]

[project.scripts]
noterat-worker = "noterat_worker.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["noterat_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

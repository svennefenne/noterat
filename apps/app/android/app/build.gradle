apply plugin: 'com.android.application'

// A release is signed with the app's own key when NOTERAT_KEYSTORE points at it (the Android workflow
// sets it from the repository's secrets), else with the debug key, for trying it out. An update only
// installs over an app signed with the same key, so keep that key safe.
def keystore = System.getenv("NOTERAT_KEYSTORE")

android {
    namespace = "io.github.svennefenne.noterat"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.svennefenne.noterat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // (the workflow counts the commits, so every build is newer than the one before)
        versionCode Integer.parseInt(System.getenv("NOTERAT_VERSION_CODE") ?: "1")
        versionName System.getenv("NOTERAT_VERSION_NAME") ?: "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Only 64-bit ARM, which every phone from the last several years is: ML Kit's text recognition
        // brings an 11 MB native library per processor type, and the others (x86 for emulators, 32-bit
        // ARM for very old phones) would add some 30 MB to the APK.
        ndk {
            abiFilters "arm64-v8a"
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv("NOTERAT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NOTERAT_KEY_ALIAS")
                keyPassword System.getenv("NOTERAT_KEY_PASSWORD") ?: System.getenv("NOTERAT_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// ML Kit's text recognition: only the Latin model (Swedish and English). The plugin also brings the
// Chinese, Devanagari, Japanese and Korean ones, several megabytes each, which the app never asks for.
configurations.configureEach {
    exclude group: 'com.google.mlkit', module: 'text-recognition-chinese'
    exclude group: 'com.google.mlkit', module: 'text-recognition-devanagari'
    exclude group: 'com.google.mlkit', module: 'text-recognition-japanese'
    exclude group: 'com.google.mlkit', module: 'text-recognition-korean'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
